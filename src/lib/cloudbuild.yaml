steps:
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'mulembe-nation-university-online-voting-system'
      - '--source'
      - '.'
      - '--region'
      - 'us-west1'
      - '--allow-unauthenticated'
options:
  logging: CLOUD_LOGGING_ONLY

steps:
  # This step deploys your code to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      [
        'run',
        'deploy',
        'mulembe-nation-university-online-voting-system',
        '--source',
        '.',
        '--region',
        'us-west1',
        '--allow-unauthenticated'
      ]

# This is the line that fixes your specific error!
options:
  logging: CLOUD_LOGGING_ONLY
